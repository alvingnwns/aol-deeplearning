<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECAPA-TDNN flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · VoiceAttend</p>
    <h1>How ECAPA-TDNN turns a voice clip into a voiceprint</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecapa-tdnn-flow-title ecapa-tdnn-flow-desc">
        <title id="ecapa-tdnn-flow-title">How ECAPA-TDNN turns a voice clip into a voiceprint</title>
        <desc id="ecapa-tdnn-flow-desc">Architecture of the SpeechBrain ECAPA-TDNN speaker encoder: filterbank features pass through a convolution and three SE-Res2Net blocks whose outputs are concatenated, attentive statistics pooling collapses time into a fixed vector, a linear layer produces a 192-dimensional embedding, and an AAM-softmax head is used only during training.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <rect x="20" y="48" width="960" height="172" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="32" y="52" width="148" height="12" rx="2" fill="#f5f5f5"/>
        <text x="106" y="61" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FRAME-LEVEL · SHAPE C × T</text>

        <rect x="468" y="260" width="512" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="480" y="264" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="273" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UTTERANCE-LEVEL · FIXED SIZE</text>

        <line x1="164" y1="172" x2="196" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="324" y1="172" x2="356" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="484" y1="172" x2="516" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="644" y1="172" x2="676" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="804" y1="172" x2="836" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 580,140 V 108 Q 580,100 588,100 H 872 Q 880,100 880,108 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 420,140 V 96 Q 420,88 428,88 H 912 Q 920,88 920,96 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="626" y="70" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="670" y="79" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALL 3 OUTPUTS</text>

        <line x1="900" y1="204" x2="900" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="908" y="230" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="938" y="239" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3072 × T</text>

        <line x1="836" y1="324" x2="788" y2="324" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="792" y="302" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="812" y="311" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LINEAR</text>

        <line x1="660" y1="324" x2="612" y2="324" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="616" y="302" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="636" y="311" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRAIN</text>

        <rect x="36" y="140" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="36" y="140" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="44" y="148" width="20" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="54" y="157" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="100" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fbank</text>
        <text x="100" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">16 kHz → 80 × T</text>

        <rect x="196" y="140" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="196" y="140" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="204" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="220" y="157" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONV</text>
        <text x="260" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conv1D + BN</text>
        <text x="260" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1024 ch · k=5</text>

        <rect x="356" y="140" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="356" y="140" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="364" y="148" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="374" y="157" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SE</text>
        <text x="420" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SE-Res2Net 1</text>
        <text x="420" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k=3 · dilation 2</text>

        <rect x="516" y="140" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="516" y="140" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="524" y="148" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="534" y="157" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SE</text>
        <text x="580" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SE-Res2Net 2</text>
        <text x="580" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k=3 · dilation 3</text>

        <rect x="676" y="140" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="676" y="140" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="684" y="148" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="694" y="157" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SE</text>
        <text x="740" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SE-Res2Net 3</text>
        <text x="740" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k=3 · dilation 4</text>

        <rect x="836" y="140" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="836" y="140" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="844" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="858" y="157" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MFA</text>
        <text x="900" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Concat + Conv</text>
        <text x="900" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3×1024 → 3072</text>

        <rect x="836" y="292" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="836" y="292" width="128" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="844" y="300" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="858" y="309" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASP</text>
        <text x="900" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Attentive Pool</text>
        <text x="900" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mean ‖ std → 6144</text>

        <rect x="660" y="292" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="292" width="128" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="668" y="300" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="682" y="309" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMB</text>
        <text x="724" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Embedding</text>
        <text x="724" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192-d voiceprint</text>

        <rect x="484" y="292" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="484" y="292" width="128" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="492" y="300" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="508" y="309" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HEAD</text>
        <text x="548" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AAM-Softmax</text>
        <text x="548" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">margin 0.2 · scale 30</text>

        <text x="640" y="408" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">attendance check drops the head: cosine(this, enrolled) ≥ θ means present</text>
        <path d="M 648 404 Q 716 400 724 360" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="724" cy="360" r="2" fill="#2d3142"/>

        <line x1="30" y1="436" x2="970" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="450" width="20" height="14" rx="3" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="140" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">input features</text>

        <rect x="272" y="450" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">frame-level layer</text>

        <rect x="448" y="450" width="20" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="476" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">where the voiceprint forms</text>

        <rect x="672" y="450" width="20" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="700" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">training only, thrown away after</text>
      </svg>
    </div>
  </div>
</body>
</html>
